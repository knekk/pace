<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="Pace-kalkulator: min/km ↔ km/t ↔ sluttid for 400 m til maraton.">
  <title>Pace</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="assets/icon.svg" alt="" class="brand-icon">
      <div>
        <h1 data-i18n="title">Pace</h1>
        <p class="tagline" data-i18n="tagline">Pace ↔ fart ↔ sluttid</p>
      </div>
    </div>

    <div class="toggles">
      <div class="seg" role="group" data-i18n-aria="unitToggle" aria-label="Bytt mellom kilometer og miles">
        <button type="button" class="seg-btn is-active" data-unit="km" aria-pressed="true">km</button>
        <button type="button" class="seg-btn" data-unit="mi" aria-pressed="false">mi</button>
      </div>
      <div class="seg" role="group" aria-label="Språk / Language">
        <button type="button" class="seg-btn is-active" data-lang="nb" aria-pressed="true">NO</button>
        <button type="button" class="seg-btn" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main class="layout">

    <section class="cards">

      <!-- Pace -->
      <article class="card" id="card-pace">
        <header class="card-head">
          <h2 data-i18n="pace">Pace</h2>
          <span class="unit-label" id="pace-unit">min/km</span>
        </header>
        <div class="picker">
          <div class="picker-row">
            <div id="wheel-pace-min"></div>
            <span class="wheel-sep">:</span>
            <div id="wheel-pace-sec"></div>
          </div>
          <div class="picker-captions">
            <span class="cap" data-i18n="minutes">min</span>
            <span class="cap-sep"></span>
            <span class="cap" data-i18n="seconds">sek</span>
          </div>
        </div>
      </article>

      <div class="eq" aria-hidden="true">=</div>

      <!-- Speed -->
      <article class="card" id="card-speed">
        <header class="card-head">
          <h2 data-i18n="speed">Fart</h2>
          <span class="unit-label" id="speed-unit">km/t</span>
        </header>
        <div class="picker">
          <div class="picker-row">
            <div id="wheel-speed-int"></div>
            <span class="wheel-sep" id="speed-sep">,</span>
            <div id="wheel-speed-tenth"></div>
          </div>
          <div class="picker-captions">
            <span class="cap">&nbsp;</span>
            <span class="cap-sep"></span>
            <span class="cap" data-i18n="tenths">tidel</span>
          </div>
        </div>
      </article>

      <div class="eq" aria-hidden="true">=</div>

      <!-- Finish time -->
      <article class="card card-wide" id="card-time">
        <header class="card-head">
          <h2 data-i18n="finishTime">Sluttid</h2>
          <span class="unit-label" id="time-dist-label">10 km</span>
        </header>
        <div class="chips" id="dist-chips" role="radiogroup" data-i18n-aria="distance" aria-label="Distanse"></div>
        <div class="picker">
          <div class="picker-row">
            <div id="wheel-time-h"></div>
            <span class="wheel-sep">:</span>
            <div id="wheel-time-m"></div>
            <span class="wheel-sep">:</span>
            <div id="wheel-time-s"></div>
          </div>
          <div class="picker-captions">
            <span class="cap" data-i18n="hours">timer</span>
            <span class="cap-sep"></span>
            <span class="cap" data-i18n="minutes">min</span>
            <span class="cap-sep"></span>
            <span class="cap" data-i18n="seconds">sek</span>
          </div>
        </div>
      </article>

    </section>

    <section class="times">
      <h2 class="times-title" data-i18n="times">Tider på denne pacen</h2>
      <div id="times-grid" class="times-grid"></div>
    </section>

  </main>

  <footer class="footer">
    <p data-i18n="shareHint">Lenken i adressefeltet husker verdiene dine.</p>
    <p data-i18n="footer">Laget for løpere. Ingen sporing, ingen innlogging.</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
